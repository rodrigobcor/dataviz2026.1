  <script id="48" type="text/x-typescript" pinned="">
    const raw = await FileAttachment("indicadores.csv").text();

    const dados = (() => {
      const primeira = raw.split("\n")[0];
      const sep = primeira.includes(";") ? ";" : primeira.includes("\t") ? "\t" : ",";
      const linhas = d3.dsvFormat(sep).parse(raw.trim());
      const num = s => +String(s).trim().replace(",", ".");
      return linhas.map(r => ({
        ano: +r["Ano"],
        mat: num(r["Taxa de PcD nas matrículas"]),
        ing: num(r["Taxa de PcD nos ingressantes"]),
        con: num(r["Taxa de PcD nos concluintes"]),
        eq:  num(r["Índice de equidade de conclusão PcD"]),
        cob: num(r["Cobertura de reserva de vagas PcD"]),
        tcm: num(r["Taxa de conclusão por matrículas"])
      })).sort((a, b) => a.ano - b.ano);
    })();
  </script>

  <script id="59" type="text/x-typescript" pinned="">
    // z-score por coluna (heatmap, bump, radar de perfil)
    const zs = (() => {
      const out = dados.map(d => ({ano: d.ano}));
      for (const {k} of indicadores) {
        const m = d3.mean(dados, d => d[k]), s = d3.deviation(dados, d => d[k]);
        dados.forEach((d, i) => out[i][k] = (d[k] - m) / s);
      }
      return out;
    })();
  </script>
  <script id="61" type="text/x-typescript" pinned="">
    // min-max 0–1 (radar)
    const mm = (() => {
      const out = dados.map(d => ({ano: d.ano}));
      for (const {k} of indicadores) {
        const [lo, hi] = d3.extent(dados, d => d[k]);
        dados.forEach((d, i) => out[i][k] = (d[k] - lo) / (hi - lo));
      }
      return out;
    })();
  </script>

        return codUf[+c] ?? p.sigla ?? p.SIGLA ?? p.UF ?? p.abbrev;
      };
      // O GeoJSON do IBGE segue a regra da mão direita (RFC 7946), mas o D3 espera o sentido oposto.
      // Sem corrigir, cada estado vira "o mundo inteiro menos o estado" e o último desenhado (DF) cobre o mapa todo.
      const inverter = rings => rings.map(ring => ring.slice().reverse());
      const corrigir = f => {
        const g = f.geometry;
        if (g.type === "Polygon") g.coordinates = inverter(g.coordinates);
        else if (g.type === "MultiPolygon") g.coordinates = g.coordinates.map(inverter);
      };
      j.features.forEach(f => {
        f.properties.uf = siglaDe(f);
        if (d3.geoArea(f) > 2 * Math.PI) corrigir(f);   // só corrige se estiver invertido
      });
      return j;
    })();
